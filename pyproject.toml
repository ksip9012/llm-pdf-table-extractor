[project]
name = "llm-pdf-table-extractor"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
  "pre-commit",
  "pypdf>=6.21.4",
  "pyright",
  "pytest",
  "ruff",
  "types-openpyxl>=3.1.5.20261017",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "I",     # isort
  "B",     # flake8-bugbear
  "UP",    # pyupgrade
  "SIM",   # flake8-simplify
  "N",     # pep8-naming
  "RUF",   # Ruff
]
# docstring やコメントを日本語で書くので、全角の文字（（）、：など）を止めるルールは外す
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: 重いテスト（pre-commit と CI の check では動かさない）",
  "integration: 外部サービスに依存するテスト",
]
